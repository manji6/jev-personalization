<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JevSense — 管理画面v2 操作モック</title>
    <style>
      :root {
        --green: #224f3d;
        --ink: #233c31;
        --muted: #7a877f;
        --line: #e1e7e2;
        --paper: #f5f6f2;
        --mint: #e9f1e8;
        --white: #fff;
        --accent: #d6e5ac;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          14px/1.65 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Noto Sans JP",
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        outline-offset: 4px;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 30px;
        line-height: 1.5;
        letter-spacing: -0.04em;
        font-weight: 650;
      }
      h2 {
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      h3 {
        font-size: 15px;
      }
      small,
      .muted {
        color: var(--muted);
      }
      svg {
        width: 19px;
        height: 19px;
        vertical-align: middle;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .prototype {
        min-height: 36px;
        background: #173a2b;
        color: #edf4e9;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 24px;
        font-size: 11px;
        position: relative;
        z-index: 30;
      }
      .prototype strong {
        color: #d7e8ad;
        letter-spacing: 0.1em;
        margin-right: 12px;
      }
      .prototype select {
        background: #294d3c;
        color: white;
        border: 1px solid #6a8374;
        border-radius: 4px;
        font-size: 11px;
        padding: 2px 5px;
        max-width: 160px;
      }
      .proto-controls {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .sidebar {
        position: fixed;
        top: 36px;
        left: 0;
        bottom: 0;
        width: 226px;
        background: #fff;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 29px 18px 18px;
        z-index: 20;
      }
      .brand {
        font-size: 25px;
        letter-spacing: -0.065em;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
      }
      .brandmark {
        width: 32px;
        height: 32px;
        border: 1px solid var(--green);
        border-radius: 9px;
        display: grid;
        place-content: center;
        font: italic 30px Georgia;
        color: var(--green);
        line-height: 1;
      }
      .brand .dot {
        color: #94ac69;
      }
      .nav-label {
        font-size: 10px;
        letter-spacing: 0.17em;
        color: #8b988e;
        margin: 35px 12px 12px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .nav a,
      .nav button {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 0;
        background: none;
        border-radius: 7px;
        padding: 11px 12px;
        text-align: left;
        color: #768479;
        font-size: 13px;
      }
      .nav a:hover {
        background: #f4f6f2;
      }
      .nav a.active {
        background: var(--mint);
        color: var(--green);
        font-weight: 650;
      }
      .nav .arrow {
        margin-left: auto;
        font-size: 14px;
      }
      .sidebar-bottom {
        margin-top: auto;
      }
      .sidebar-note {
        font:
          italic 18px/1.8 Georgia,
          "Noto Serif JP",
          serif;
        margin: 36px 12px 24px;
        color: #889782;
      }
      .account-link {
        display: flex;
        align-items: center;
        gap: 10px;
        border-top: 1px solid var(--line);
        padding: 16px 8px 0;
        font-size: 12px;
      }
      .account-link small {
        display: block;
        font-size: 10px;
      }
      .avatar {
        display: grid;
        place-content: center;
        background: #e5ede5;
        border-radius: 50%;
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        color: #476847;
        font-size: 12px;
        font-weight: 600;
      }
      .shell {
        margin-left: 226px;
      }
      .topbar {
        height: 83px;
        background: #ffffffd9;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        gap: 20px;
      }
      .site-picker {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .site-avatar {
        height: 34px;
        width: 34px;
        border-radius: 8px;
        background: #dce8d7;
        display: grid;
        place-content: center;
        font-family: Georgia;
        font-size: 19px;
      }
      .site-picker small {
        display: block;
        line-height: 1.2;
        font-size: 10px;
        letter-spacing: 0.05em;
      }
      .site-picker select {
        font-size: 13px;
        font-weight: 650;
        background: transparent;
        border: 0;
        max-width: 250px;
        cursor: pointer;
        margin-left: -4px;
      }
      .top-actions {
        display: flex;
        gap: 18px;
        align-items: center;
        font-size: 12px;
        color: #7c897e;
      }
      .role-chip {
        padding: 4px 9px;
        background: #f1f4ee;
        border: 1px solid #e0e8dc;
        border-radius: 5px;
        color: #72816b;
        font-size: 10px;
      }
      .main {
        max-width: 1360px;
        margin: auto;
        padding: 33px 40px 70px;
      }
      .crumb {
        font-size: 11px;
        color: #8a978c;
        margin-bottom: 22px;
        display: flex;
        gap: 9px;
      }
      .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 29px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.2em;
        color: #82917b;
        margin-bottom: 7px;
      }
      .desc {
        font-size: 12px;
        color: #859080;
        margin-top: 8px;
        max-width: 650px;
      }
      .button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 10px 16px;
        font-size: 12px;
        font-weight: 550;
        white-space: nowrap;
      }
      .button.primary {
        background: var(--green);
        border-color: var(--green);
        color: white;
      }
      .button.secondary {
        background: #f0f4e8;
        border-color: #e2e9d5;
      }
      .button.danger {
        color: #9c3e32;
        background: #fff8f5;
        border-color: #efdbd5;
      }
      .button.link {
        border: 0;
        background: none;
        color: #6e8172;
        padding: 6px 0;
      }
      .button.wide {
        width: 100%;
      }
      .button.small {
        padding: 6px 10px;
        font-size: 11px;
      }
      .button svg {
        width: 15px;
        height: 15px;
      }
      .card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .card-header {
        padding: 20px 24px;
        border-bottom: 1px solid #edf0eb;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
      }
      .card-body {
        padding: 24px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-bottom: 26px;
      }
      .stat {
        padding: 21px 24px;
        position: relative;
      }
      .stat label {
        color: #879281;
        font-size: 12px;
      }
      .stat .number {
        font-size: 32px;
        font-weight: 450;
        letter-spacing: -0.04em;
        margin-top: 8px;
      }
      .stat .number small {
        font-size: 11px;
        letter-spacing: 0;
        margin-left: 5px;
      }
      .stat .stat-icon {
        position: absolute;
        right: 24px;
        top: 24px;
        color: #9caf94;
      }
      .badge {
        font-size: 10px;
        padding: 4px 9px;
        border-radius: 20px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .badge.active {
        background: #e9f2e7;
        color: #55794b;
      }
      .badge.paused {
        background: #f3eee4;
        color: #a1875c;
      }
      .badge.draft {
        background: #f0f2f3;
        color: #7f8b91;
      }
      .badge::before {
        content: "";
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: currentColor;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th {
        font-weight: 400;
        font-size: 10px;
        color: #9aa397;
        background: #fcfcfa;
        white-space: nowrap;
      }
      th,
      td {
        padding: 17px 24px;
        border-bottom: 1px solid #edf0eb;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td {
        font-size: 12px;
      }
      td.title {
        min-width: 220px;
        font-weight: 600;
      }
      td.title small {
        display: block;
        font-size: 10px;
        font-weight: 400;
        margin-top: 4px;
      }
      td.empty {
        text-align: center;
        color: #879382;
        padding: 40px;
      }
      .row-link {
        font-weight: 600;
        border: 0;
        background: none;
        padding: 0;
        text-align: left;
        cursor: pointer;
      }
      .row-link:hover {
        color: #729450;
      }
      .row-actions {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: flex-end;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .filter-tabs,
      .tabs {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .filter-tabs button,
      .tabs button {
        border: 0;
        background: none;
        font-size: 12px;
        color: #8b9587;
        padding: 7px 0;
        position: relative;
        white-space: nowrap;
      }
      .filter-tabs button.selected,
      .tabs button.selected {
        color: var(--green);
        font-weight: 650;
      }
      .filter-tabs button.selected:after,
      .tabs button.selected:after {
        content: "";
        height: 2px;
        position: absolute;
        bottom: -10px;
        left: 0;
        right: 0;
        background: #5f7d4c;
      }
      .search {
        position: relative;
      }
      .search input {
        background: #f9faf7;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 7px 10px 7px 31px;
        font-size: 11px;
        max-width: 210px;
      }
      .search svg {
        position: absolute;
        left: 10px;
        top: 10px;
        width: 13px;
        height: 13px;
        color: #97a38e;
      }
      .info {
        border: 1px solid #e5ebda;
        background: #f4f7ee;
        border-radius: 7px;
        padding: 13px 16px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 11px;
        color: #78866f;
        margin-bottom: 22px;
      }
      .info svg {
        width: 15px;
        height: 15px;
        margin-top: 2px;
      }
      .results-placeholder {
        min-height: 195px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        flex-direction: column;
        gap: 10px;
        color: #9aa491;
        background: linear-gradient(135deg, #fafbf7, #f4f6ee);
        border-radius: 0 0 10px 10px;
      }
      .placeholder-bars {
        display: flex;
        gap: 5px;
        align-items: flex-end;
        height: 35px;
      }
      .placeholder-bars i {
        display: block;
        width: 7px;
        background: #dce5cf;
        border-radius: 2px;
        height: 15px;
      }
      .placeholder-bars i:nth-child(2) {
        height: 26px;
      }
      .placeholder-bars i:nth-child(3) {
        height: 20px;
      }
      .placeholder-bars i:nth-child(4) {
        height: 34px;
      }
      .results-placeholder p {
        font-size: 11px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 24px;
      }
      .tabs {
        border-bottom: 1px solid var(--line);
        padding: 0 24px 13px;
        overflow-x: auto;
      }
      .tabs button {
        padding-top: 15px;
      }
      .tabs button.selected:after {
        bottom: -14px;
      }
      .field {
        display: block;
        margin-bottom: 22px;
        font-size: 12px;
        font-weight: 550;
      }
      .field input,
      .field textarea,
      .field select {
        display: block;
        width: 100%;
        margin-top: 9px;
        background: #fff;
        border: 1px solid #dce3d9;
        border-radius: 6px;
        padding: 11px 12px;
        font-size: 12px;
        font-weight: 400;
        min-width: 0;
      }
      .field input:focus,
      .field textarea:focus {
        border-color: #7c9c71;
      }
      .field textarea {
        resize: vertical;
        min-height: 105px;
        line-height: 1.8;
      }
      .field .hint {
        display: block;
        font-weight: 400;
        font-size: 10px;
        color: #96a08f;
        margin-top: 7px;
      }
      .field:last-child {
        margin-bottom: 0;
      }
      .fields2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .section-label {
        font-size: 11px;
        font-weight: 600;
        margin: 26px 0 15px;
      }
      .segmented {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .segmented button {
        padding: 9px 12px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: white;
        font-size: 11px;
      }
      .segmented button.selected {
        border-color: #709167;
        background: #eff5e9;
        color: #557444;
      }
      .editor-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 24px;
        font-size: 11px;
        color: #91a085;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .preview-card {
        position: sticky;
        top: 20px;
        align-self: start;
      }
      .preview-stage {
        background: #edf0e7;
        min-height: 310px;
        padding: 28px 24px;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }
      .preview-offer {
        background: #fff;
        border-radius: 9px;
        padding: 23px;
        box-shadow: 0 12px 25px #283b2420;
        max-width: 100%;
        width: 270px;
        position: relative;
      }
      .preview-offer h3 {
        font-size: 16px;
        margin-bottom: 10px;
        padding-right: 14px;
      }
      .preview-offer p {
        font-size: 11px;
        color: #8b9583;
        line-height: 1.9;
      }
      .preview-offer .close {
        position: absolute;
        right: 13px;
        top: 11px;
        color: #96a08c;
      }
      .preview-offer .cta {
        background: var(--green);
        color: white;
        font-size: 10px;
        padding: 9px 13px;
        border-radius: 4px;
        display: inline-block;
        margin-top: 18px;
      }
      .preview-offer.bar {
        width: 100%;
        border-radius: 0;
        font-size: 11px;
      }
      .preview-caption {
        font-size: 10px;
        padding: 14px 20px;
        color: #9aa38f;
      }
      .meta-row {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #edf0e8;
        padding: 13px 0;
        font-size: 11px;
      }
      .meta-row:last-child {
        border: 0;
      }
      .meta-row span:first-child {
        color: #9aa38f;
      }
      .color-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 16px 0;
        font-size: 12px;
      }
      .color-row input {
        width: 38px;
        height: 36px;
        border: 1px solid var(--line);
        background: white;
        padding: 3px;
        border-radius: 5px;
      }
      .check {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        font-size: 12px;
        margin: 14px 0;
      }
      .check input {
        accent-color: var(--green);
        margin-top: 4px;
      }
      .step-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-bottom: 26px;
      }
      .step {
        padding: 24px;
      }
      .step .step-n {
        font-size: 10px;
        color: #9aac8d;
        letter-spacing: 0.1em;
        margin-bottom: 12px;
      }
      .step h3 {
        font-size: 13px;
        margin-bottom: 7px;
      }
      .step p {
        font-size: 11px;
        color: #8e9985;
      }
      .list-row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        padding: 19px 24px;
        border-bottom: 1px solid #edf0e8;
        font-size: 12px;
      }
      .list-row:last-child {
        border: 0;
      }
      .list-row small {
        display: block;
        font-size: 10px;
        margin-top: 3px;
      }
      .list-left {
        display: flex;
        gap: 14px;
        align-items: center;
        min-width: 0;
      }
      .list-left svg {
        color: #8b9d7a;
        width: 25px;
        height: 25px;
      }
      .right-note {
        font-size: 10px;
        color: #98a08f;
      }
      .login {
        min-height: calc(100dvh - 36px);
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .login-art {
        background: #e9eddf;
        position: relative;
        padding: 58px 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }
      .login-art .brand {
        padding: 0;
      }
      .login-art:before {
        content: "";
        position: absolute;
        right: -120px;
        top: 18%;
        width: 540px;
        height: 540px;
        border: 1px solid #cad5ba;
        border-radius: 50%;
      }
      .login-art:after {
        content: "";
        position: absolute;
        right: -65px;
        top: 23%;
        width: 430px;
        height: 430px;
        border: 1px solid #d2dbc5;
        border-radius: 50%;
      }
      .login-copy {
        z-index: 1;
        margin: 80px 0;
      }
      .login-copy h1 {
        font-family: Georgia, "Noto Serif JP", serif;
        font-size: 44px;
        line-height: 1.55;
        font-weight: 400;
        letter-spacing: -0.06em;
      }
      .login-copy p {
        font-size: 12px;
        color: #879779;
        margin-top: 28px;
        line-height: 2.1;
      }
      .login-bottom {
        font-size: 10px;
        color: #98a18d;
        z-index: 1;
      }
      .login-form {
        padding: 70px 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      .login-inner {
        max-width: 370px;
        width: 100%;
      }
      .login-inner h1 {
        font-size: 26px;
        margin: 12px 0;
      }
      .login-inner .desc {
        line-height: 1.9;
        margin-bottom: 32px;
      }
      .fingerprint {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        background: #eff3e8;
        display: grid;
        place-content: center;
        color: #829c6c;
        margin-bottom: 26px;
      }
      .fingerprint svg {
        width: 29px;
        height: 29px;
      }
      .invite-card {
        margin-bottom: 25px;
      }
      .login-foot {
        border-top: 1px solid var(--line);
        margin-top: 30px;
        padding-top: 20px;
        font-size: 11px;
        color: #9aa38e;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .text-button {
        padding: 0;
        border: 0;
        background: none;
        color: #76866b;
        font-size: 11px;
        text-align: left;
        cursor: pointer;
      }
      .help-note {
        font-size: 10px;
        color: #9ca58f;
        margin-top: 16px;
        line-height: 1.8;
      }
      .modal-shade {
        position: fixed;

  <body>
    <div class="prototype">
      <div>

          >画面とフローの検討用 · 認証・配信・メール送信は実行しません</span
        >
      </div>
      <div class="proto-controls">

          <option value="recover">パスキーの復旧</option></select
        ><label for="demoRole">権限を再現</label

          <option value="admin">サイト管理者</option>
          <option value="editor">編集者</option>

    </div>
    <div id="app"></div>
    <div id="modalRoot"></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const paths = {
        home: "M3 10l7-6 7 6M5 9v8h10V9M8 17v-5h4v5",
        campaigns: "M3 5h14v12H3zM6 3v4M14 3v4M3 9h14M6 12h3M6 14h6",
        settings:
          "M10 3v2M10 15v2M3 10h2M15 10h2M5 5l1 1M14 14l1 1M5 15l1-1M14 6l1-1M13 10a3 3 0 1 1-6 0 3 3 0 0 1 6 0",
        debug: "M7 3h6M10 3v4M5 8h10v9H5zM3 10h2M15 10h2M3 14h2M15 14h2M8 11h4",

          "M12 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0M3 17v-2c0-4 12-4 12 0v2M15 4c4 0 4 5 1 6M17 12l1 4",

        info: "M10 8v6M10 5v.1M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0",
        chart: "M4 16V9M10 16V4M16 16v-5",
        logout: "M8 3H3v14h5M8 10h10M14 6l4 4-4 4",
        device: "M4 3h12v10H4zM2 16h16",

      };
      const icon = (name) =>
        `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="${paths[name] || paths.info}"/></svg>`;
      const blankCampaign = () => ({

                "ポロシャツや夏のスポーツウェアをじっくり見ていて、吸汗速乾の機能に関心がありそうな人。",

            },
            {

              body: "お届けについてのご案内です。",

        {

            {

      ];
      const s = {
        logged: false,
        role: "owner",
        site: "atelier",
        sites: structuredClone(initial),
        filter: "all",
        query: "",
        edit: null,
        editTab: "audience",

        installationTab: "sites",

        passkeys: [
          "MacBook Air · iCloud キーチェーン",

        ],
        invites: [],
        registeredEmail: "mika@example.com",
      };
      const roleNames = {
        owner: "Superuser",
        admin: "サイト管理者",
        editor: "編集者",
        viewer: "閲覧者",
      };
      const site = () => s.sites.find((v) => v.id === s.site);
      const effectiveRole = () =>
        s.role === "admin" && s.site === "studio"
          ? "editor"
          : s.role === "editor" && s.site === "studio"
            ? "viewer"
            : s.role;
      const canEdit = () => effectiveRole() !== "viewer";
      const canManage = () => ["owner", "admin"].includes(effectiveRole());

        s.role === "viewer"
          ? s.sites.filter((v) => v.id === "atelier")
          : s.sites;

          active: "配信中",

          bar: "通知バー",
          custom: "独自JavaScript",
        };
      const badge = (c) =>
        `<span class="badge ${esc(c.status)}">${statusNames[c.status]}</span>`;
      const button = (label, action, kind = "primary", disabled = false) =>
        `<button class="button ${kind}" data-action="${action}" ${disabled ? "disabled" : ""}>${label}</button>`;

        `<div class="brand"><span class="brandmark">j.</span><span class="brand-word">JevSense<span class="dot">.</span></span></div>`;
      const info = (t) =>
        `<div class="info">${icon("info")}<span>${t}</span></div>`;
      function toast(t) {
        $("toast").textContent = t;
        $("toast").hidden = false;
        setTimeout(() => ($("toast").hidden = true), 4200);
      }
      function dialog(title, body, actions, extra = "") {
        $("modalRoot").innerHTML =
          `<div class="modal-shade"><section class="modal ${extra}" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1"><h2>${title}</h2>${body}<div class="actions">${actions}</div></section></div>`;
        const m = $("modalRoot").querySelector(".modal");
        m.focus();
      }
      function closeDialog() {
        $("modalRoot").replaceChildren();
      }
      let nextAction = null;
      function guard(action) {
        if (!s.dirty) {
          action();
          return;
        }
        nextAction = action;
        dialog(
          "未保存の変更があります",
          "<p>サイトや画面を切り替えると、保存していない変更は破棄されます。</p>",
          button("編集を続ける", "cancel", "") +
            button("破棄して切り替える", "discard", "primary"),
        );
      }
      function go(route) {
        guard(() => {
          s.dirty = false;
          if (location.hash === "#/" + route) render();
          else location.hash = "/" + route;
        });
      }
      function heading(eyebrow, title, desc, action = "") {
        return `<div class="heading"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1>${desc ? `<p class="desc">${desc}</p>` : ""}</div>${action}</div>`;
      }
      function loginPage(kind) {
        const normal = kind === "login";
        const invitation = s.currentInvite || {
          email: "yui@example.com",
          site: "atelier",
          role: "editor",
        };
        let content = "";
        if (normal)
          content = `<div class="fingerprint">${icon("finger")}</div><p class="eyebrow">WELCOME BACK</p><h1>おかえりなさい。</h1><p class="desc">パスキーで安全にログインして、<br>あなたのサイトの施策を管理しましょう。</p><form data-form="login"><label class="field">メールアドレス<input type="email" name="email" required autocomplete="username webauthn" value="${esc(s.registeredEmail)}" placeholder="you@example.com"></label><button class="button primary wide" type="submit">${icon("key")}パスキーでログイン${icon("arrow")}</button></form><p class="help-note">Face ID・Touch ID・端末のPIN、またはセキュリティキーで本人確認できます。</p><div class="login-foot"><button class="text-button" data-nav="recover">パスキーが使えない場合</button><span>初めての方は、管理者から共有された招待リンクを開いてください。</span></div>`;

        if (kind === "invite")
          content = `<div class="fingerprint">${icon("users")}</div><p class="eyebrow">YOU'RE INVITED</p><h1>チームに参加しませんか。</h1><p class="desc">佐藤 美香さんが、あなたをJevSenseに招待しました。</p><div class="card card-body invite-card"><div class="meta-row"><span>招待されたメール</span><strong>${esc(invitation.email)}</strong></div><div class="meta-row"><span>サイト</span><strong>${esc(s.sites.find((v) => v.id === invitation.site)?.name || invitation.site)}</strong></div><div class="meta-row"><span>権限</span><strong>${roleNames[invitation.role]}</strong></div></div>${button(icon("key") + "招待を確認してパスキーを登録", "join", "primary wide")}<p class="help-note">これは手動共有された招待リンクを開いた画面のモックです。実装版では期限付き・1回限りのリンクを確認します。メールの所有確認とは区別します。</p><div class="login-foot"><button class="text-button" data-nav="login">すでにアカウントをお持ちの方</button></div>`;

          location.hash = "/" + e.target.value;
          render();
        }
      });
      document.addEventListener("keydown", (e) => {
        const modal = $("modalRoot").querySelector('[role="dialog"]');
        if (!modal) return;
        if (e.key === "Escape") {
          closeDialog();
          nextAction = null;
        }
        if (e.key === "Tab") {
          const nodes = [
            ...modal.querySelectorAll(
              "button:not(:disabled),input,select,textarea,[href]",
            ),
          ];
          const first = nodes[0],
            last = nodes.at(-1);
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last?.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first?.focus();
          }
        }
      });
      window.addEventListener("hashchange", render);
      render();
    </script>
  </body>
</html>
